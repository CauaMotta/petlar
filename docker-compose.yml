services:
  petlar-frontend:
    build:
      context: ./PetLar_FrontEnd
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080
        - VITE_API_PREFIX=/api
    container_name: petlar-frontend-container
    ports:
      - '5173:80'
    networks:
      - petlar_network
    depends_on:
      - petlar-backend

  petlar-backend:
    build:
      context: ./PetLar_BackEnd
      dockerfile: Dockerfile
    container_name: petlar-backend-container
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://petlaruser:petlarpass@petlar-mongo:27017/petlardb?authSource=admin
      - TOKEN_SECRET=secret
    depends_on:
      - petlar-mongo
    networks:
      - petlar_network

  petlar-mongo:
    image: mongo:latest
    container_name: petlar-mongo-container
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=petlaruser
      - MONGO_INITDB_ROOT_PASSWORD=petlarpass
      - MONGO_INITDB_DATABASE=petlardb
    volumes:
      - petlar-mongo-data:/data/db
    networks:
      - petlar_network

networks:
  petlar_network:
    driver: bridge

volumes:
  petlar-mongo-data:
